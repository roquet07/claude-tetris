name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio ("${{ github.event.issue.title }}").

            1. Lee el título y la descripción del issue, y revisa el código del repo (game.js, index.html, style.css) si hace falta contexto.
            2. Asigna los labels que correspondan usando ÚNICAMENTE los labels ya existentes en el repo (`gh label list`). No crees labels nuevos bajo ninguna circunstancia.
            3. Publica un comentario en el issue con un diagnóstico técnico: qué está pasando, causa probable, archivos y funciones concretas de `game.js`, `index.html` o `style.css` involucradas, y qué haría falta para implementar la solución. No escribas código todavía, solo el diagnóstico.

            Usa `gh issue edit ${{ github.event.issue.number }} --add-label "..."` para los labels y `gh issue comment ${{ github.event.issue.number }} --body "..."` para el diagnóstico.
          claude_args: '--allowed-tools "Bash(gh label list),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"'
